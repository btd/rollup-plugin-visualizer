
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Rollup Visualizer</title>
  <style>
:root {
  --font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans",
    sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  --background-color: #2b2d42;
  --text-color: #edf2f4;
}

html {
  box-sizing: border-box;
}

*,
*:before,
*:after {
  box-sizing: inherit;
}

html {
  background-color: var(--background-color);
  color: var(--text-color);
  font-family: var(--font-family);
}

body {
  padding: 0;
  margin: 0;
}

html,
body {
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

svg {
  vertical-align: middle;
  width: 100%;
  height: 100%;
  max-height: 100vh;
}

main {
  flex-grow: 1;
  height: 100vh;
  padding: 20px;
}

.tooltip {
  position: absolute;
  z-index: 1070;
  border: 2px solid;
  border-radius: 5px;
  padding: 5px;
  font-size: 0.875rem;
  background-color: var(--background-color);
  color: var(--text-color);
}

.tooltip-hidden {
  visibility: hidden;
  opacity: 0;
}

.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: row;
  font-size: 0.7rem;
  align-items: center;
  margin: 0 50px;
  height: 20px;
}

.size-selectors {
  display: flex;
  flex-direction: row;
  align-items: center;
}

.size-selector {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  margin-right: 1rem;
}
.size-selector input {
  margin: 0 0.3rem 0 0;
}

.filters {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
}

.module-filters {
  display: flex;
  flex-grow: 1;
}

.module-filter {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 1;
}
.module-filter input {
  flex: 1;
  height: 1rem;
  padding: 0.01rem;
  font-size: 0.7rem;
  margin-left: 0.3rem;
}
.module-filter + .module-filter {
  margin-left: 0.5rem;
}

.node {
  cursor: pointer;
}

main {
  padding: 10px 12px;
}

.treemap-v2 {
  --muted: #b9c0d0;
  --control-border: #626a80;
  --control-radius: 4px;
  --hover: rgb(255 255 255 / 7%);
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  font-size: 12px;
}
.treemap-v2 button,
.treemap-v2 input,
.treemap-v2 select {
  font: inherit;
  color: inherit;
}
.treemap-v2 button,
.treemap-v2 summary,
.treemap-v2 .size-selector,
.treemap-v2 .tmv2-row {
  border-radius: var(--control-radius);
}
.treemap-v2 button {
  border: 0;
  background: transparent;
  padding: 4px 7px;
  min-height: 26px;
  cursor: pointer;
}
.treemap-v2 button:enabled:hover,
.treemap-v2 button:enabled:focus-visible,
.treemap-v2 summary:hover,
.treemap-v2 summary:focus-visible,
.treemap-v2 .size-selector:hover,
.treemap-v2 .tmv2-internal-row:hover,
.treemap-v2 .tmv2-internal-row:focus-within {
  background: var(--hover);
}
.treemap-v2 button:disabled {
  opacity: 0.45;
  cursor: default;
}
.treemap-v2 .tmv2-icon {
  display: inline-block;
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  vertical-align: -3px;
}
.treemap-v2 .tmv2-icon-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.treemap-v2 .tmv2-measurement-note > summary,
.treemap-v2 .tmv2-internal > summary {
  display: flex;
  align-items: center;
  gap: 4px;
  list-style: none;
  padding: 4px;
  cursor: pointer;
}
.treemap-v2 summary::-webkit-details-marker {
  display: none;
}
.treemap-v2 details[open] > summary > .tmv2-disclosure-icon {
  transform: rotate(90deg);
}
.treemap-v2 button:focus-visible,
.treemap-v2 input:focus-visible,
.treemap-v2 select:focus-visible,
.treemap-v2 summary:focus-visible {
  outline: 2px solid #d1e0ff;
  outline-offset: 2px;
}
.treemap-v2 input,
.treemap-v2 select {
  border: 1px solid var(--control-border);
  border-radius: var(--control-radius);
  background: rgba(0, 0, 0, 0.09);
  padding: 5px 6px;
  min-width: 0;
}
.treemap-v2 select {
  color: var(--text-color);
  cursor: pointer;
}
.treemap-v2 select option {
  color: #222536;
  background-color: #f5f6fa;
}
.treemap-v2 select:hover,
.treemap-v2 input:not([type=radio]):hover {
  border-color: var(--muted);
}
.treemap-v2 .size-selector :is(input, label) {
  cursor: pointer;
}
.treemap-v2 .tmv2-controls {
  display: flex;
  flex-shrink: 0;
  padding-bottom: 8px;
}
.treemap-v2 .sidebar {
  position: static;
  height: auto;
  margin: 0;
  flex: 1;
  flex-wrap: wrap;
  font-size: 12px;
  gap: 6px;
}
.treemap-v2 .module-filters {
  min-width: 260px;
  gap: 14px;
}
.treemap-v2 .module-filter {
  min-width: 0;
}
.treemap-v2 .module-filter + .module-filter {
  margin-left: 0;
}
.treemap-v2 .module-filter input {
  min-width: 0;
  height: auto;
  padding: 4px 6px;
  font-size: 12px;
}
.treemap-v2 .tmv2-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(300px, 30%, 380px);
  flex: 1;
  min-height: 0;
  column-gap: 16px;
}
.treemap-v2 .tmv2-workspace.details-closed {
  grid-template-columns: minmax(0, 1fr);
}
.treemap-v2 .tmv2-chart {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.treemap-v2 .tmv2-chart-navigation {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  flex-shrink: 0;
}
.treemap-v2 .tmv2-chart-navigation nav {
  flex: 1;
  min-width: 0;
  max-height: 72px;
  overflow: auto;
  overflow-wrap: anywhere;
}
.treemap-v2 .tmv2-chart-navigation nav button {
  padding-inline: 3px;
  text-align: left;
}
.treemap-v2 .tmv2-plot {
  position: relative;
  flex: 1;
  min-height: 0;
  min-width: 0;
}
.treemap-v2 .tmv2-plot svg {
  width: 100%;
  height: 100%;
  display: block;
  font-size: 1rem;
}
.treemap-v2 .tmv2-chart-empty {
  position: absolute;
  padding: 12px;
  max-width: 34em;
  pointer-events: none;
}
.treemap-v2 .tmv2-hover {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
  min-width: 0;
  color: var(--muted);
  font: 11px/18px monospace;
}
.treemap-v2 .tmv2-hover span:first-child {
  flex: 1;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}
.treemap-v2 .tmv2-hover span:last-child {
  flex-shrink: 0;
}
.treemap-v2 .tmv2-inspector {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.treemap-v2 .tmv2-inspector[hidden] {
  display: none;
}
.treemap-v2 .tmv2-inspector-header {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 8px;
  min-height: 30px;
  margin-bottom: 8px;
}
.treemap-v2 .tmv2-identity {
  flex-shrink: 0;
  max-height: 45%;
  overflow-y: auto;
  padding: 0 4px 10px;
}
.treemap-v2 .tmv2-kind,
.treemap-v2 .tmv2-measurement-note,
.treemap-v2 .tmv2-availability {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}
.treemap-v2 .tmv2-kind {
  margin-bottom: 3px;
  overflow-wrap: anywhere;
}
.treemap-v2 h2 {
  font-size: 15px;
  margin: 0 0 7px;
  overflow-wrap: anywhere;
}
.treemap-v2 .tmv2-id {
  display: block;
  min-width: 0;
  max-height: 96px;
  overflow: auto;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  user-select: text;
  font: 11px/16px monospace;
}
.treemap-v2 .tmv2-measurement {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 8px;
  margin: 9px 0 4px;
}
.treemap-v2 .tmv2-measurement strong {
  font-size: 14px;
  font-weight: 600;
}
.treemap-v2 .tmv2-measurement span,
.treemap-v2 .tmv2-other-sizes {
  font-size: 11px;
  color: var(--muted);
}
.treemap-v2 .tmv2-measurement span {
  min-width: 0;
  overflow-wrap: anywhere;
}
.treemap-v2 .tmv2-other-sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.treemap-v2 .tmv2-measurement-note {
  margin-top: 7px;
}
.treemap-v2 .tmv2-measurement-note p {
  margin: 5px 0;
}
.treemap-v2 .tmv2-availability {
  margin-top: 5px;
}
.treemap-v2 .tmv2-availability:empty {
  margin: 0;
}
.treemap-v2 .tmv2-show-chart {
  color: #d1e0ff;
}
.treemap-v2 .tmv2-occurrence-choice {
  display: block;
  margin-top: 8px;
}
.treemap-v2 .tmv2-occurrence-choice select {
  display: block;
  width: 100%;
  margin-top: 4px;
}
.treemap-v2 .tmv2-occurrences {
  max-height: 110px;
  overflow-y: auto;
}
.treemap-v2 .tmv2-occurrences > div {
  margin: 7px 0;
}
.treemap-v2 .tmv2-occurrences b,
.treemap-v2 .tmv2-occurrences span {
  display: block;
  overflow-wrap: anywhere;
}
.treemap-v2 .tmv2-sections {
  display: flex;
  flex-shrink: 0;
  gap: 5px;
}
.treemap-v2 .tmv2-sections button {
  border-bottom: 2px solid transparent;
  padding: 7px 4px;
}
.treemap-v2 .tmv2-sections button[aria-pressed=true] {
  border-bottom-color: #d1e0ff;
}
.treemap-v2 .tmv2-sections span {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.treemap-v2 .tmv2-list-body {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  padding-top: 8px;
}
.treemap-v2 .tmv2-list-scope {
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 6px;
  flex-shrink: 0;
}
.treemap-v2 .tmv2-search {
  display: block;
  margin-bottom: 6px;
  flex-shrink: 0;
}
.treemap-v2 .tmv2-search input {
  width: 100%;
  display: block;
  color: var(--text-color);
}
.treemap-v2 .tmv2-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
}
.treemap-v2 .tmv2-row {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 4px;
}
.treemap-v2 .tmv2-sort {
  margin-bottom: 6px;
  color: var(--muted);
}
.treemap-v2 .tmv2-file {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 8px;
}
.treemap-v2 .tmv2-file small {
  grid-column: 1;
}
.treemap-v2 .tmv2-file b {
  grid-column: 2;
  grid-row: 1/3;
  align-self: center;
  font-variant-numeric: tabular-nums;
}
.treemap-v2 .tmv2-path {
  display: block;
  font: 11px/17px monospace;
  overflow-wrap: anywhere;
}
.treemap-v2 .tmv2-path + .tmv2-path {
  color: var(--muted);
}
.treemap-v2 .tmv2-row small {
  color: var(--muted);
  display: block;
  font-size: 11px;
  margin-top: 2px;
  overflow-wrap: anywhere;
}
.treemap-v2 .tmv2-kind-label {
  color: #d1e0ff;
}
.treemap-v2 .tmv2-internal {
  flex-shrink: 0;
  max-height: 30%;
  overflow-y: auto;
  margin-top: 8px;
  font-size: 11px;
}
.treemap-v2 .tmv2-internal summary {
  color: var(--muted);
}
.treemap-v2 .tmv2-internal-row button {
  min-height: 0;
  padding: 0;
  text-align: inherit;
  overflow-wrap: anywhere;
  background: transparent;
}
.treemap-v2 .tmv2-internal-row button:enabled:hover,
.treemap-v2 .tmv2-internal-row button:enabled:focus-visible {
  background: transparent;
  text-decoration: underline;
}
.treemap-v2 .tmv2-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-height: 700px) {
  .treemap-v2 .tmv2-identity {
    max-height: 40%;
  }
}
.treemap-v2 .return-list{display:flex;align-items:center;gap:6px;align-self:flex-start;color:#bfd7ff;margin:0 0 6px}</style>
</head>

    	  input = REPLACEMENTS[input] || input;

    	  const opts = { ...options };
    	  const max = typeof opts.maxLength === 'number' ? Math.min(MAX_LENGTH, opts.maxLength) : MAX_LENGTH;

    	  if (len > max) {

    	  const bos = { type: 'bos', value: '', output: opts.prepend || '' };
    	  const tokens = [bos];

    	  const capture = opts.capture ? '' : '?:';

    	  // create constants based on platform, for windows or posix
    	  const PLATFORM_CHARS = constants.globChars(opts.windows);
    	  const EXTGLOB_CHARS = constants.extglobChars(PLATFORM_CHARS);

    	  const {
    	    DOT_LITERAL,
    	    PLUS_LITERAL,

    	  const globstar = opts => {
    	    return `(${capture}(?:(?!${START_ANCHOR}${opts.dot ? DOTS_SLASH : DOT_LITERAL}).)*?)`;

    	  const nodot = opts.dot ? '' : NO_DOT;
    	  const qmarkNoDot = opts.dot ? QMARK : QMARK_NO_DOT;
    	  let star = opts.bash === true ? globstar(opts) : STAR;

    	  if (opts.capture) {
    	    star = `(${star})`;
    	  }

    	  // minimatch options support
    	  if (typeof opts.noext === 'boolean') {
    	    opts.noextglob = opts.noext;
    	  }

    	  const state = {
    	    input,
    	    index: -1,
    	    start: 0,
    	    dot: opts.dot === true,
    	    consumed: '',
    	    output: '',
    	    prefix: '',
    	    backtrack: false,
    	    negated: false,
    	    brackets: 0,
    	    braces: 0,
    	    parens: 0,

    	    globstar: false,

    	  len = input.length;

    	  const extglobs = [];
    	  const braces = [];
    	  const stack = [];
    	  let prev = bos;
    	  let value;

    	  /**
    	   * Tokenizing helpers
    	   */

    	  const eos = () => state.index === len - 1;
    	  const peek = state.peek = (n = 1) => input[state.index + n];
    	  const advance = state.advance = () => input[++state.index] || '';
    	  const remaining = () => input.slice(state.index + 1);
    	  const consume = (value = '', num = 0) => {

    	    state.index += num;
    	  };

    	  const append = token => {

    	  };

    	  const negate = () => {
    	    let count = 1;

    	    while (peek() === '!' && (peek(2) !== '(' || peek(3) === '?')) {

    	      state.start++;
    	      count++;
    	    }

    	      return false;
    	    }

    	    state.negated = true;
    	    state.start++;
    	    return true;
    	  };

    	  const increment = type => {
    	    state[type]++;
    	    stack.push(type);
    	  };

    	  const decrement = type => {

    	    stack.pop();
    	  };

    	  /**
    	   * Push tokens onto the tokens array. This helper speeds up
    	   * tokenizing by 1) helping us avoid backtracking as much as possible,
    	   * and 2) helping us avoid creating extra tokens when consecutive
    	   * characters are plain text. This improves performance and simplifies
    	   * lookbehinds.
    	   */

    	  const push = tok => {
    	    if (prev.type === 'globstar') {
    	      const isBrace = state.braces > 0 && (tok.type === 'comma' || tok.type === 'brace');
    	      const isExtglob = tok.extglob === true || (extglobs.length && (tok.type === 'pipe' || tok.type === 'paren'));

    	      if (tok.type !== 'slash' && tok.type !== 'paren' && !isBrace && !isExtglob) {
    	        state.output = state.output.slice(0, -prev.output.length);

    	        prev.value = '*';
    	        prev.output = star;
    	        state.output += prev.output;
    	      }
    	    }

    	    if (extglobs.length && tok.type !== 'paren') {
    	      extglobs[extglobs.length - 1].inner += tok.value;
    	    }

    	    if (tok.value || tok.output) append(tok);
    	    if (prev && prev.type === 'text' && tok.type === 'text') {
    	      prev.output = (prev.output || prev.value) + tok.value;
    	      prev.value += tok.value;
    	      return;
    	    }

    	    tok.prev = prev;
    	    tokens.push(tok);
    	    prev = tok;
    	  };

    	  const extglobOpen = (type, value) => {
    	    const token = { ...EXTGLOB_CHARS[value], conditions: 1, inner: '' };

    	    token.prev = prev;
    	    token.parens = state.parens;
    	    token.output = state.output;
    	    token.startIndex = state.index;
    	    token.tokensIndex = tokens.length;
    	    const output = (opts.capture ? '(' : '') + token.open;

    	    increment('parens');
    	    push({ type, value, output: state.output ? '' : ONE_CHAR });
    	    push({ type: 'paren', extglob: true, value: advance(), output });
    	    extglobs.push(token);
    	  };

    	  const extglobClose = token => {
    	    const literal = input.slice(token.startIndex, state.index + 1);

    	    if ((token.type === 'plus' || token.type === 'star') && analysis.risky) {

    	        ? (token.output ? '' : ONE_CHAR) + (opts.capture ? `(${analysis.safeOutput})` : analysis.safeOutput)
    	        : undefined;

    	      open.type = 'text';
    	      open.value = literal;
    	      open.output = safeOutput || utils.escapeRegex(literal);

    	      for (let i = token.tokensIndex + 1; i < tokens.length; i++) {

    	        tokens[i].output = '';
    	        delete tokens[i].suffix;
    	      }

    	      state.output = token.output + open.output;
    	      state.backtrack = true;

    	    }

    	    let rest;

    	    if (token.type === 'negate') {

    	        // In this case, we need to parse the string and use it in the output of the original pattern.
    	        // Suitable patterns: `/!(*.d).ts`, `/!(*.d).{ts,tsx}`, `**/!(*-dbg).@(js)`.

    	  };

    	  /**

    	   */

    	  if (opts.fastpaths !== false && !/(^[*!]|[/()[\]{}"])/.test(input)) {

    	      }

    	      }

    	        push({ type: 'text', value });
    	        continue;
    	      }

    	      let slashes = 0;

    	      } else {

    	      }

    	        continue;
    	      }

    	      continue;

    	      prev.star = true;
    	      prev.value += value;

    	      state.backtrack = true;
    	      state.globstar = true;
    	      consume(value);
    	      continue;
    	    }

    	    let rest = remaining();
    	    if (opts.noextglob !== true && /^\([^?]/.test(rest)) {

    	      continue;
